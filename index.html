<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; manifest-src 'self'; worker-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0b0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="random9">
<meta name="description" content="サーバーに何も送らず、ブラウザの中だけで安全な乱数を作ります。">
<title>random9 — サーバー通信をしない乱数・パスワードジェネレーター</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<script defer src="js/rng.js"></script>
<script defer src="js/modes.js"></script>
<script defer src="js/i18n.js"></script>
<script defer src="js/app.js"></script>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <img src="icons/icon-192.png" alt="" width="28" height="28">
      <h1 class="brand-name">random9</h1>
    </div>
    <nav class="actions">
      <button id="how" type="button" class="ghost" data-i18n="how"></button>
      <!-- 公開時にリポジトリのURLへ書き換える -->
      <a id="repo" class="ghost" href="https://github.com/9qyu/random9" target="_blank" rel="noopener noreferrer">GitHub<span aria-hidden="true"> ↗</span></a>
    </nav>
  </header>

  <div class="stage">
    <main class="panels">
      <section class="card settings">
        <div class="tabs" role="tablist" id="tabs" data-i18n-label="modes">
          <button type="button" role="tab" id="tab-int" aria-controls="panel-int" aria-selected="true" data-i18n="tabInt"></button>
          <button type="button" role="tab" id="tab-pw" aria-controls="panel-pw" aria-selected="false" tabindex="-1" data-i18n="tabPw"></button>
        </div>
        <form id="form" novalidate autocomplete="off">
          <div class="panes">
          <div id="panel-int" role="tabpanel" aria-labelledby="tab-int">
            <div class="row2 range">
              <div class="field">
                <label for="int-min" data-i18n="min"></label>
                <input id="int-min" type="text" inputmode="text" autocomplete="off" spellcheck="false" value="1">
              </div>
              <span class="tilde" aria-hidden="true">〜</span>
              <div class="field">
                <label for="int-max" data-i18n="max"></label>
                <input id="int-max" type="text" inputmode="text" autocomplete="off" spellcheck="false" value="100">
              </div>
            </div>
            <div class="row2">
              <div class="field">
                <label for="int-count" data-i18n="count"></label>
                <input id="int-count" type="number" min="1" max="1000" step="1" value="1" autocomplete="off">
              </div>
              <label class="check" for="int-unique">
                <input id="int-unique" type="checkbox">
                <span data-i18n="unique"></span>
              </label>
            </div>
          </div>

          <div id="panel-pw" role="tabpanel" aria-labelledby="tab-pw" hidden>
            <div class="field">
              <label for="pw-length"><span data-i18n="length"></span>: <output id="pw-length-out" for="pw-length">20</output></label>
              <input id="pw-length" type="range" min="8" max="128" step="1" value="20">
            </div>
            <div class="checks">
              <label class="check" for="pw-alpha">
                <input id="pw-alpha" type="checkbox" checked>
                <span data-i18n="alpha"></span>
              </label>
              <label class="check" for="pw-symbols">
                <input id="pw-symbols" type="checkbox" checked>
                <span data-i18n="symbols"></span>
              </label>
            </div>
            <p class="note" data-i18n="digitsNote"></p>
          </div>
          </div>

          <p id="error" class="error" role="alert"></p>
          <button id="generate" type="submit" class="primary" data-i18n="generate"></button>
        </form>
      </section>

      <section id="result" class="card result" data-state="empty" aria-labelledby="result-title">
        <h2 id="result-title" class="result-title" data-i18n="resultTitle"></h2>
        <div class="result-body">
          <p id="placeholder" class="placeholder" data-i18n="placeholder"></p>
        <output id="out" class="out" aria-live="polite"></output>
        </div>
        <div id="gauge" class="gauge" role="meter" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0"><span></span><span></span><span></span><span></span></div>
        <p id="detail" class="detail"></p>
        <div class="result-actions">
          <button id="copy" type="button" class="secondary" disabled>
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="8.5" y="8.5" width="11" height="11" rx="2.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 5.5v-.3a1.7 1.7 0 0 0-1.7-1.7H5.7A1.7 1.7 0 0 0 4 5.2v8.1a1.7 1.7 0 0 0 1.7 1.7h.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <span id="copy-label"></span>
          </button>
        </div>
      </section>
    </main>
    <ul class="badges">
      <li>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 4v16M8 20h8M5 7h14M5 7l-3 6a3 3 0 0 0 6 0L5 7ZM19 7l-3 6a3 3 0 0 0 6 0L19 7Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-i18n="badge1"></span>
      </li>
      <li>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 2.8 4.5 5.8v5.4c0 4.5 3.1 8 7.5 10 4.4-2 7.5-5.5 7.5-10V5.8L12 2.8Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m8.8 12.1 2.3 2.3 4.1-4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-i18n="badge2"></span>
      </li>
      <li>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="m8 8-4 4 4 4M16 8l4 4-4 4M13.6 5.8l-3.2 12.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-i18n="badge3"></span>
      </li>
    </ul>
  </div>
</div>

<div id="toast" class="toast" role="status"></div>

<dialog id="about" aria-labelledby="about-title">
  <div class="dlg-head">
    <h2 id="about-title"></h2>
    <button id="about-close" type="button" class="icon-btn" data-i18n-label="close">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="dlg-body" id="about-body"></div>
</dialog>

<noscript><p class="noscript">JavaScript が必要です。 / JavaScript is required.</p></noscript>
</body>
</html>
